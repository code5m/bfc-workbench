<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自选 · 专题视频库</title><link rel="stylesheet" href="/studio.css"></head><body>
<aside><a class="brand" href="#topics">自选<span>把注意力还给自己</span></a><nav><a href="#topics">专题书架</a><a href="#library">全部视频</a><a href="#watch">继续观看</a><a href="/manage#sync">数据管理 ↗</a></nav><p>主动选题，自定顺序。<br>你的收藏，不必再吃灰。</p></aside>
<main><header><div><small>YOUR PERSONAL VIDEO LIBRARY</small><h1 id="heading">专题书架</h1></div><button id="new-topic">＋ 新建专题</button></header><p id="message" role="status">正在读取收藏…</p>
<section id="topic-view"><div class="intro"><h2>今天，想深入了解什么？</h2><p>从一个问题出发，把值得看的视频编成自己的学习路径。</p></div><section id="resume-home"><h2>继续观看</h2><div id="home-continue"></div></section><h2>我的专题</h2><div id="topics" class="grid"></div></section>
<section id="library-view" hidden><div class="toolbar"><input id="search" type="search" placeholder="搜索标题或 BV 号"><select id="filter" aria-label="筛选分类"><option value="">全部分类</option></select><select id="confidence" aria-label="筛选置信度"><option value="">全部置信度</option><option value="low">低置信度</option></select><button id="duplicates">检查重复</button></div><div class="toolbar"><label><input id="select-page" type="checkbox"> 本页全选</label><select id="assign-topic" aria-label="加入哪个专题"></select><button id="add-selected">加入专题</button><select id="assign-category" aria-label="修改为哪个分类"></select><button id="recategorize">修改分类</button><span id="selection-count"></span></div><div id="videos"></div><div class="toolbar"><button id="prev">上一页</button><span id="pages"></span><button id="next">下一页</button></div></section>
<section id="detail-view" hidden><button id="back">← 专题书架</button><h2 id="detail-title"></h2><p id="detail-description"></p><div class="toolbar"><button id="edit-topic">编辑专题</button><button id="find-videos">从视频库添加</button><span>上下调整顺序；勾选记录看完。</span></div><div id="playlist"></div></section>
<section id="watch-view" hidden><h2>按自己的节奏，接着看</h2><div id="continue-list"></div></section>
<dialog id="topic-dialog"><form id="topic-form"><h2>编辑专题</h2><label>专题名称<input id="topic-name" required maxlength="80"></label><label>简介<textarea id="topic-description" maxlength="1000"></textarea></label><label>专题笔记<textarea id="topic-notes" maxlength="10000" placeholder="记录学习目标、关键问题或复习要点"></textarea></label><label>章节（每行一个）<textarea id="topic-chapters" placeholder="入门\n进阶\n实践"></textarea></label><div class="toolbar"><button type="button" id="close-dialog">取消</button><button type="submit">保存专题</button></div></form></dialog>
<footer>分类及专题调整会同步到本地服务端，并保留浏览器缓存。<button id="export">导出备份</button><label>导入备份 <input type="file" id="import" accept="application/json"></label><button id="logout" type="button">退出会话</button></footer></main><script src="/studio.js" type="module"></script></body></html>
